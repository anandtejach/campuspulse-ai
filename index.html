<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>CampusPulse AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0a1230;--card:#111b3d;--card2:#16224a;--line:#26356b;--tx:#e8edff;--mu:#9aa8d6;--cy:#22d3ee;--vi:#8b5cf6;--ok:#34d399;--wa:#fbbf24;--er:#f87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(900px 500px at 85% -10%,rgba(139,92,246,.25),transparent),var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
a{color:var(--cy)}h1,h2,h3{line-height:1.2;margin:0 0 .5rem}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(10,18,48,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav{max-width:1100px;margin:auto;padding:.7rem 1rem;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.15rem;margin-right:auto;color:var(--tx);text-decoration:none}.logo b{color:var(--cy)}
nav a.l{color:var(--mu);text-decoration:none;padding:.45rem .8rem;border-radius:8px}nav a.l:hover,nav a.l.on{color:var(--tx);background:var(--card2)}
main{max-width:1100px;margin:auto;padding:1.5rem 1rem 4rem}
.btn{background:linear-gradient(135deg,var(--cy),var(--vi));color:#04102a;border:0;padding:.7rem 1.2rem;border-radius:10px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;font-size:1rem}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--line)}.btn.s{padding:.4rem .8rem;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.1rem;transition:transform .2s,border-color .2s}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.hero{padding:3rem 0 2rem}.hero h1{font-size:clamp(2rem,6vw,3.4rem);background:linear-gradient(90deg,#fff,var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--cy);font-weight:600;letter-spacing:.04em}.mu{color:var(--mu)}
.card.f:hover{transform:translateY(-3px);border-color:var(--cy)}
.stat{font-size:2rem;font-weight:800}
label{display:block;font-weight:600;margin:.8rem 0 .3rem}
input,select,textarea{width:100%;background:#0c1538;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:.65rem .8rem;font:inherit}
.err{color:var(--er);font-size:.9rem;min-height:1.2em}
.pill{display:inline-block;padding:.1rem .6rem;border-radius:99px;font-size:.78rem;font-weight:700;border:1px solid}
.Low{color:var(--ok)}.Medium{color:var(--cy)}.High{color:var(--wa)}.Critical{color:var(--er)}
.Pending{color:var(--wa)}.In-Progress{color:var(--cy)}.Resolved{color:var(--ok)}
.banner{border-radius:10px;padding:.7rem 1rem;margin-bottom:1rem;border:1px solid;font-size:.92rem}
.b-w{background:rgba(251,191,36,.1);color:var(--wa)}.b-o{background:rgba(52,211,153,.1);color:var(--ok)}.b-e{background:rgba(248,113,113,.1);color:var(--er)}.b-i{background:rgba(34,211,238,.08);color:var(--cy)}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 160px}
.item{cursor:pointer;margin-bottom:.7rem;display:block;width:100%;text-align:left;color:inherit;font:inherit}
.item:hover{border-color:var(--cy)}
.bar{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--cy),var(--vi))}
.demo{color:var(--vi);border-color:var(--vi)}
.modal{position:fixed;inset:0;background:rgba(3,8,25,.8);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:1.5rem 1rem;z-index:20}
.modal .card{max-width:640px;width:100%;background:var(--card2)}
.spin{display:inline-block;width:1em;height:1em;border:2px solid var(--line);border-top-color:var(--cy);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.trend{display:flex;gap:6px;align-items:flex-end;height:90px}.trend div{flex:1;background:linear-gradient(var(--vi),var(--cy));border-radius:4px 4px 0 0;min-height:3px}
</style></head><body>
<header><nav aria-label="Main"><a class="logo" href="#home">Campus<b>Pulse</b> AI</a>
<a class="l" href="#home">Home</a><a class="l" href="#report">Report</a><a class="l" href="#my">Issues</a><a class="l" href="#admin">Admin</a></nav></header>
<main id="app" aria-live="polite"></main><div id="modal"></div>
<script>
const CATS=["Maintenance","Internet/Wi-Fi","Sanitation","Electrical","Plumbing","Safety","Other"],STAT=["Pending","In Progress","Resolved"];
const D=(n)=>new Date(Date.now()-n*864e5).toISOString();
const mk=(id,t,d,l,c,p,dept,s,n,r)=>({id,title:t,description:d,location:l,category:c,priority:p,reason:r,dept,action:"Assign to "+dept+" and confirm on site.",dupes:[],analysisSource:"demo-sample",status:s,createdAt:D(n),history:[{status:"Pending",at:D(n),note:"Submitted"}].concat(s!="Pending"?[{status:s,at:D(n-1),note:"Demo status change"}]:[]),demo:true});
const DEMO=[mk("d1","Water cooler not working","The water cooler near the library entrance gives no cold water.","Library, Ground Floor","Maintenance","Low","Facilities","Pending",1,"Inconvenience only; no safety risk."),
mk("d2","Wi-Fi down in Block C labs","No Wi-Fi in Block C labs since morning; students cannot access online lab portal.","Block C, 2nd Floor","Internet/Wi-Fi","High","IT Services","In Progress",3,"Affects many students and ongoing classes."),
mk("d3","Overflowing dustbins near canteen","Dustbins overflowing and smelling bad near the canteen.","Canteen","Sanitation","Medium","Housekeeping","Resolved",5,"Hygiene concern, not urgent."),
mk("d4","Exposed wires in corridor","Sparking exposed wires hanging from the ceiling in the corridor.","Block A, 1st Floor","Safety","Critical","Electrical / Safety Office","Pending",0,"Possible electric shock or fire hazard.")];
let S={issues:[],db:null,user:null,sample:null,demoOn:true,q:"",fc:"",fs:"",fp:"",sel:null,loaded:false,dberr:""};
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>new Date(d).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
const all=()=>[...S.issues,...(S.demoOn?DEMO:[])].sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
const cls=s=>s.replace(" ","-");
const pill=(t,c)=>`<span class="pill ${c}">${esc(t)}</span>`;

/* ---------- analysis ---------- */
const RULES=[["Safety",/spark|exposed wire|fire|smoke|gas|electric shock|injur|fall|collapse|crack|stuck|harass|unsafe|danger|broken glass/i,"Critical","Safety Office","Possible risk to people."],
["Electrical",/light|bulb|power|fan|switch|socket|short circuit|projector|ac\b/i,"Medium","Electrical Dept.","Affects comfort or class use."],
["Internet/Wi-Fi",/wi-?fi|internet|network|router|lan\b|portal/i,"High","IT Services","Connectivity affects many users."],
["Plumbing",/leak|tap|water|pipe|flush|toilet|drain|cooler/i,"Medium","Plumbing / Facilities","Water issues can worsen."],
["Sanitation",/dustbin|garbage|trash|smell|dirty|clean|waste|overflow/i,"Medium","Housekeeping","Hygiene concern."],
["Maintenance",/broken|damage|bench|desk|chair|door|window|board|equipment/i,"Low","Maintenance","Needs repair."]];
function ruleAnalyze(t,d){const x=t+" "+d;let r=RULES.find(r=>r[1].test(x))||["Other",0,"Low","Admin Office","Not enough detail to classify automatically."];
let p=r[2];if(/urgent|many students|exam|since morning|all |flood/i.test(x)&&p!="Critical")p=p=="Low"?"Medium":p=="Medium"?"High":p;
return{category:r[0],priority:p,reason:r[4],dept:r[3],action:r[0]=="Safety"?"Prompt human review recommended: inspect the site immediately and restrict access if needed.":"Assign to "+r[3]+", confirm on site, and update status.",source:"demo-rules"}}
async function analyze(t,d,l){
 if(S.sample){try{const j=await S.sample.json(`You triage campus issue reports. Return ONLY JSON: {"category":one of ${CATS.join("|")},"priority":Low|Medium|High|Critical,"reason":string,"dept":string,"action":string}. Safety hazards must be High or Critical and action must recommend prompt human review.\nTitle: ${t}\nDescription: ${d}\nLocation: ${l}`,{modelTier:"quick"});
  if(CATS.includes(j.category)&&["Low","Medium","High","Critical"].includes(j.priority))return{...j,source:"ai"}}catch(e){console.warn(e)}}
 return ruleAnalyze(t,d)}
/* ---------- duplicates ---------- */
const tok=s=>new Set(s.toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>2&&!["the","and","not","near","with","has","are","for"].includes(w)));
function similar(t,d,l,c,skip){const a=tok(t+" "+d);return all().filter(i=>i.id!=skip&&i.status!="Resolved").map(i=>{const b=tok(i.title+" "+i.description);let n=0;a.forEach(w=>b.has(w)&&n++);let sc=n/Math.max(1,Math.min(a.size,b.size));if(l&&i.location.toLowerCase()==l.toLowerCase())sc+=.25;if(c&&i.category==c)sc+=.1;return{i,sc}}).filter(x=>x.sc>=.45).sort((a,b)=>b.sc-a.sc).slice(0,3)}
/* ---------- data ---------- */
async function initCaps(){
 try{S.user=await claude.use("user");const db=await claude.use("db");S.sample=await claude.use("sample");
  if(db){S.db=db.collection("issues");S.db.onSnapshot(s=>{S.issues=s.docs.map(x=>({...x.data(),id:x.id}));S.loaded=true;render()},e=>{S.dberr=e.message;S.loaded=true;render()})}
 }catch(e){S.dberr=String(e.message||e)}
 S.loaded=true;render()}
const isAdmin=()=>!!(S.user&&S.user.canEdit&&S.user.canEdit());
async function saveIssue(i){if(S.db){await S.db.doc(i.id).set(i);return true}S.issues.unshift(i);return false}
async function setStatus(id,status,note){const i=all().find(x=>x.id==id),h=[...i.history,{status,at:new Date().toISOString(),note:note||""}];
 const patch={status,resolutionNote:note||i.resolutionNote||"",history:h};
 if(i.demo){Object.assign(i,patch);return}
 if(S.db)await S.db.doc(id).update(patch);else Object.assign(i,patch)}
/* ---------- views ---------- */
function banner(){let h="";
 if(!S.db&&S.loaded)h+=`<div class="banner b-w" role="status"><b>Storage not connected.</b> Reports are kept in memory only and vanish on refresh. Open this page in claude.ai (signed in) so the built-in database can persist issues.${S.dberr?" ("+esc(S.dberr)+")":""}</div>`;
 h+=`<div class="banner b-i">${S.sample?"<b>AI analysis on:</b> reports are analyzed by Claude via the platform’s server-side sampling (no API key in this page).":"<b>Demo mode:</b> AI is unavailable here, so analysis uses simple keyword rules, not real AI. To enable AI, open the page in claude.ai and approve the AI access prompt."}</div>`;return h}
const views={
home(){const a=all();const real=S.issues.length;return `<section class="hero"><p class="tag">Report it. Understand it. Resolve it.</p><h1>A Smarter Campus Starts With You.</h1>
<p class="mu" style="max-width:640px">Broken coolers, Wi-Fi outages and leaking taps often go unreported or get lost in chat groups. CampusPulse AI gives students one place to report problems and gives administrators a prioritized, trackable queue.</p>
<p class="row" style="max-width:420px"><a class="btn" href="#report">Report an Issue</a><a class="btn g" href="#admin">Explore Dashboard</a></p></section>
<div class="banner b-i"><b>First time here?</b> 1) Click <i>Report an Issue</i> and describe a problem, 2) see the analysis and duplicate suggestions, 3) open <i>Admin</i> to change its status.</div>
<div class="grid" style="margin-bottom:1rem">${[["AI-powered analysis","Suggests category, department and next action."],["Priority detection","Flags urgent and safety issues for human review."],["Duplicate detection","Shows similar open reports before you submit."],["Transparent tracking","Every status change is logged in a history."]].map(f=>`<div class="card f"><h3>${f[0]}</h3><p class="mu" style="margin:0">${f[1]}</p></div>`).join("")}</div>
<div class="grid">${[["Issues shown",a.length],["Pending",a.filter(i=>i.status=="Pending").length],["Resolved",a.filter(i=>i.status=="Resolved").length]].map(s=>`<div class="card"><div class="stat">${s[1]}</div><div class="mu">${s[0]}</div></div>`).join("")}</div>
<p class="mu" style="font-size:.88rem">Statistics are calculated from saved records (${real} real submission${real==1?"":"s"}) plus ${S.demoOn?DEMO.length+" clearly labeled demo samples":"no demo samples"}. <label style="display:inline"><input type="checkbox" style="width:auto" ${S.demoOn?"checked":""} onchange="S.demoOn=this.checked;render()"> Include demo samples</label></p>`},
report(){return `<h2>Report an issue</h2><form id="f" class="card" novalidate>
<label for="t">Issue title *</label><input id="t" maxlength="120" autocomplete="off"><div class="err" id="et"></div>
<label for="d">Detailed description *</label><textarea id="d" rows="4" maxlength="1500"></textarea><div class="err" id="ed"></div>
<label for="l">Building / location *</label><input id="l" maxlength="80" placeholder="e.g. Block C, 2nd Floor"><div class="err" id="el"></div>
<label for="c">Category</label><select id="c"><option value="">Let AI suggest</option>${CATS.map(c=>`<option>${c}</option>`).join("")}</select>
<p class="mu" style="font-size:.85rem">Image attachments aren’t supported in this version.</p>
<div id="dup"></div><div class="err" id="ef" role="alert"></div>
<button class="btn" id="sb" type="submit">Analyze &amp; submit</button></form>`},
my(){const a=filtered();return `<h2>Campus issues</h2>${filters()}<div id="list">${a.length?a.map(card).join(""):`<div class="card mu">No issues match. Try clearing filters or <a href="#report">report a new issue</a>.</div>`}</div>`},
admin(){const a=all(),n=s=>a.filter(i=>i.status==s).length,f=filtered();
 const cc=CATS.map(c=>[c,a.filter(i=>i.category==c).length]).filter(x=>x[1]),mx=Math.max(1,...cc.map(x=>x[1]));
 const days=[...Array(7)].map((_,k)=>{const d=new Date(Date.now()-(6-k)*864e5).toDateString();return a.filter(i=>new Date(i.createdAt).toDateString()==d).length}),dm=Math.max(1,...days);
 return `<h2>Administrator dashboard</h2>${isAdmin()?"":`<div class="banner b-w">Read-only: only the page owner/editors can change statuses. ${S.user?"":"Sign-in not detected."}</div>`}
<div class="grid" style="margin-bottom:1rem">${[["Total",a.length],["Pending",n("Pending")],["In Progress",n("In Progress")],["Resolved",n("Resolved")]].map(s=>`<div class="card"><div class="stat">${s[1]}</div><div class="mu">${s[0]}</div></div>`).join("")}</div>
<div class="grid" style="margin-bottom:1rem"><div class="card"><h3>By category</h3>${a.length>=3?cc.map(x=>`<div style="margin:.4rem 0"><span class="mu">${x[0]} (${x[1]})</span><div class="bar" style="width:${x[1]/mx*100}%"></div></div>`).join(""):`<p class="mu">Needs at least 3 issues.</p>`}</div>
<div class="card"><h3>Last 7 days</h3>${a.length>=3?`<div class="trend">${days.map(v=>`<div title="${v}" style="height:${v/dm*100}%"></div>`).join("")}</div>`:`<p class="mu">Needs at least 3 issues.</p>`}</div></div>
${filters()}<div id="list">${f.length?f.map(card).join(""):`<div class="card mu">No matching issues.</div>`}</div>`}};
function filtered(){const q=S.q.toLowerCase();return all().filter(i=>(!q||(i.title+i.description+i.location).toLowerCase().includes(q))&&(!S.fc||i.category==S.fc)&&(!S.fs||i.status==S.fs)&&(!S.fp||i.priority==S.fp))}
function filters(){const o=(v,arr,ph,k)=>`<select aria-label="${ph}" onchange="S.${k}=this.value;relist()"><option value="">${ph}</option>${arr.map(c=>`<option ${v==c?"selected":""}>${c}</option>`).join("")}</select>`;
 return `<div class="row" style="margin-bottom:1rem"><input type="search" aria-label="Search issues" placeholder="Search title, description, location" value="${esc(S.q)}" oninput="S.q=this.value;relist()" style="flex:2 1 220px">${o(S.fc,CATS,"All categories","fc")}${o(S.fs,STAT,"All statuses","fs")}${o(S.fp,["Low","Medium","High","Critical"],"All priorities","fp")}</div>`}
function relist(){const r=location.hash.slice(1)||"home",f=filtered();$("#list").innerHTML=f.length?f.map(card).join(""):`<div class="card mu">No matching issues.</div>`}
const card=i=>`<button class="card item" onclick="openIssue('${i.id}')"><div class="row" style="justify-content:space-between"><b style="flex:3 1 200px">${esc(i.title)}</b><span style="flex:0 0 auto">${pill(i.priority,i.priority)} ${pill(i.status,cls(i.status))} ${i.demo?pill("DEMO","demo"):""}</span></div><div class="mu" style="font-size:.9rem">${esc(i.location)} · ${esc(i.category)} · ${fmt(i.createdAt)}</div></button>`;
function openIssue(id){const i=all().find(x=>x.id==id);if(!i)return;const adm=isAdmin()&&location.hash=="#admin";
 const src={ai:"AI analysis (Claude)","demo-rules":"Demo rule-based analysis (not AI)","demo-sample":"Demo sample data"}[i.analysisSource]||"";
 const dups=(i.dupes||[]).map(d=>all().find(x=>x.id==d)).filter(Boolean);
 $("#modal").innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()" role="dialog" aria-modal="true" aria-label="Issue details"><div class="card"><div class="row" style="justify-content:space-between"><h3 style="flex:3 1 200px">${esc(i.title)}</h3><button class="btn g s" style="flex:0 0 auto" onclick="closeM()">Close</button></div>
<p>${pill(i.priority,i.priority)} ${pill(i.status,cls(i.status))} ${i.demo?pill("DEMO","demo"):""} <span class="mu">${esc(i.location)} · ${esc(i.category)}</span></p><p>${esc(i.description)}</p>
<div class="card" style="background:var(--card)"><b>${src}</b><p class="mu" style="margin:.3rem 0"><b>Priority reason:</b> ${esc(i.reason)}<br><b>Department:</b> ${esc(i.dept)}<br><b>Next action:</b> ${esc(i.action)}</p>
${dups.length?`<p class="mu" style="margin:0"><b>Possible duplicates:</b> ${dups.map(d=>esc(d.title)).join("; ")}</p>`:""}<p class="mu" style="margin:.3rem 0 0;font-size:.85rem">Analysis is a suggestion, not a resolution. A person must verify and act.</p></div>
${i.resolutionNote?`<p><b>Resolution note:</b> ${esc(i.resolutionNote)}</p>`:""}
<h4>Status history</h4>${i.history.map(h=>`<div class="mu" style="font-size:.9rem">${fmt(h.at)} · <b>${esc(h.status)}</b> ${esc(h.note||"")}</div>`).join("")}
${adm?`<label for="ns">Update status</label><select id="ns">${STAT.map(s=>`<option ${s==i.status?"selected":""}>${s}</option>`).join("")}</select><label for="nn">Resolution note</label><textarea id="nn" rows="2" maxlength="500">${esc(i.resolutionNote||"")}</textarea><div class="err" id="em" role="alert"></div><p><button class="btn" id="us" onclick="upd('${i.id}')">Save status</button></p>`:""}</div></div>`}
function closeM(){$("#modal").innerHTML=""}
async function upd(id){const b=$("#us");b.disabled=true;try{await setStatus(id,$("#ns").value,$("#nn").value.trim());closeM();render()}catch(e){$("#em").textContent="Could not save: "+(e.message||"network or permission error")+". Nothing was changed.";b.disabled=false}}
function bindForm(){const f=$("#f");if(!f)return;let tm;const chk=()=>{clearTimeout(tm);tm=setTimeout(()=>{const t=$("#t").value,d=$("#d").value;if(t.length<4&&d.length<10){$("#dup").innerHTML="";return}
 const m=similar(t,d,$("#l").value,$("#c").value);$("#dup").innerHTML=m.length?`<div class="banner b-w"><b>Similar open reports:</b> ${m.map(x=>`<div>• ${esc(x.i.title)} <span class="mu">(${esc(x.i.location)}, ${x.i.status})</span></div>`).join("")}<div class="mu">You can still submit if yours is different.</div></div>`:""},300)};
 ["t","d","l","c"].forEach(k=>$("#"+k).addEventListener("input",chk));
 f.onsubmit=async e=>{e.preventDefault();const t=$("#t").value.trim(),d=$("#d").value.trim(),l=$("#l").value.trim();let ok=true;
  const v=(id,c,m)=>{$("#e"+id).textContent=c?"":m;if(!c)ok=false};v("t",t.length>=4,"Enter a title (at least 4 characters).");v("d",d.length>=15,"Describe the problem in at least 15 characters.");v("l",l.length>=2,"Enter the building or location.");if(!ok)return;
  const b=$("#sb");b.disabled=true;b.innerHTML='<span class="spin"></span> Analyzing…';$("#ef").textContent="";
  try{const a=await analyze(t,d,l),cat=$("#c").value||a.category,id="i"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
   const dupes=similar(t,d,l,cat).map(x=>x.i.id),now=new Date().toISOString();
   const i={id,title:t,description:d,location:l,category:cat,priority:a.priority,reason:a.reason,dept:a.dept,action:a.action,dupes,analysisSource:a.source,status:"Pending",createdAt:now,history:[{status:"Pending",at:now,note:"Submitted"}]};
   const persisted=await saveIssue(i);
   $("#app").innerHTML=`<div class="banner ${persisted?"b-o":"b-w"}" role="status">${persisted?"<b>Saved.</b> Your report is stored and visible in the issue list.":"<b>Added for this session only.</b> No database is connected, so it will disappear on refresh."}</div>
   <div class="card"><h3>${esc(t)}</h3><p>${pill(a.priority,a.priority)} <span class="mu">${esc(cat)} · ${a.source=="ai"?"AI analysis (Claude)":"Demo rule-based analysis (not AI)"}</span></p><p class="mu"><b>Why:</b> ${esc(a.reason)}<br><b>Department:</b> ${esc(a.dept)}<br><b>Next:</b> ${esc(a.action)}</p>${a.priority=="Critical"||cat=="Safety"?`<p class="err" style="color:var(--er)">Safety-related: this needs prompt human review. If someone is in danger, contact campus security directly.</p>`:""}
   <p class="row"><a class="btn" href="#my">View issue list</a><a class="btn g" href="#report" onclick="setTimeout(render)">Report another</a></p></div>`
  }catch(e){$("#ef").textContent="Could not save your report: "+(e.message||"network error")+". Please try again.";b.disabled=false;b.textContent="Analyze & submit"}}}
function render(){const r=location.hash.slice(1)||"home";if(!views[r]){location.hash="home";return}
